[project]
name = "web"
version = "0.1.0"
description = ""
authors = [
    {name = "Nicolás Mele",email = "nico.mele@yahoo.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "sqlalchemy (>=2.0,<2.1)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "flask-sqlalchemy-lite (>=0.2.1,<0.3.0)",
    "flask-session (>=0.8.0,<0.9.0)",
    "marshmallow (>=4,<5)",
    "pyjwt (>=2.15.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "web", from = "src"}]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
